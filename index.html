<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交易測驗</title>
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="交易測驗" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
:root{--bg:#0b1020;--card:#121a2f;--card-2:#18233d;--text:#f5f7fb;--muted:#9eabc5;--line:#2b3755;--accent:#7aa2ff;--accent-2:#9b8cff;--danger:#ff7c7c;--ok:#7fe3b3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#09101f,#10182a 45%,#0b1020);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{border:1px solid var(--line);background:#1a2540;color:var(--text);padding:.8rem 1rem;border-radius:12px;cursor:pointer}button:hover{filter:brightness(1.08)}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:white;font-weight:700}button.danger{border-color:#5a2e3a;color:#ffb7b7}.app-shell{max-width:1120px;margin:0 auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;font-size:.82rem}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem)}.subtitle{color:var(--muted);max-width:760px;line-height:1.7}.card{background:rgba(18,26,47,.94);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 14px 40px rgba(0,0,0,.18)}.task-card{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:linear-gradient(135deg,rgba(122,162,255,.18),rgba(155,140,255,.10)),var(--card)}.label{color:var(--muted);font-size:.85rem}.big-value{font-size:1.7rem;font-weight:800;margin-top:8px}.big-value.small{font-size:1.1rem}h2{font-size:1.15rem;margin:0 0 16px}.choice-grid,.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice-grid label,.rule-grid label{background:var(--card-2);border:1px solid var(--line);padding:14px;border-radius:12px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.form-grid label,.block-label{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.9rem}input,textarea{width:100%;background:#0e1629;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}textarea{resize:vertical;line-height:1.6}.block-label{margin:14px 0}.action-card,.history-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.action-card p,.history-head p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.history-list{display:flex;flex-direction:column;gap:10px}.history-item{display:grid;grid-template-columns:1.2fr .9fr .7fr .7fr auto;gap:12px;align-items:center;background:#0f1729;border:1px solid var(--line);border-radius:12px;padding:12px}.history-item .muted{color:var(--muted);font-size:.86rem}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1f2c49;font-size:.82rem}.win{color:var(--ok)}.loss{color:#ff9a9a}.empty{color:var(--muted);text-align:center;padding:20px}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{overflow-x:hidden}.app-shell{width:min(100%,1120px);padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(28px,env(safe-area-inset-bottom))}main{min-width:0}.card{min-width:0;overflow:hidden}.task-card>div,.form-grid>label,.choice-grid>label,.rule-grid>label{min-width:0}.big-value{overflow-wrap:anywhere}input,textarea,button{max-width:100%}.choice-grid label,.rule-grid label{display:flex;align-items:flex-start;gap:10px;line-height:1.45}.choice-grid input,.rule-grid input{width:auto;flex:0 0 auto;margin-top:.18em;accent-color:var(--accent)}.actions button{min-height:44px}.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.install-btn{border-color:var(--accent);color:#dbe5ff}@media(max-width:850px){.task-card{grid-template-columns:repeat(2,minmax(0,1fr))}.choice-grid,.rule-grid,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar,.action-card{align-items:flex-start;flex-direction:column}.history-item{grid-template-columns:minmax(0,1.3fr) minmax(90px,.7fr);gap:10px}.history-item>button{grid-column:1/-1;width:100%}}@media(max-width:600px){body{background:var(--bg)}.app-shell{padding-top:14px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.topbar{margin-bottom:10px}h1{font-size:clamp(1.75rem,9vw,2.35rem)}.eyebrow{font-size:.72rem}.subtitle{font-size:.92rem;line-height:1.55;margin-bottom:0}.top-actions{width:100%;display:grid;grid-template-columns:1fr}.topbar button{width:100%}.card{border-radius:16px;padding:16px;margin:12px 0;box-shadow:none}.task-card{grid-template-columns:1fr 1fr;gap:10px}.task-card>div{background:rgba(14,22,41,.42);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:12px}.task-card>div:first-child{grid-column:1/-1}.big-value{font-size:1.35rem;margin-top:5px}.big-value.small{font-size:1rem}h2{font-size:1.05rem;line-height:1.5}.choice-grid,.rule-grid,.form-grid{grid-template-columns:1fr}.choice-grid label,.rule-grid label{padding:13px;min-height:48px}input,textarea{font-size:16px}textarea{min-height:96px}.action-card{gap:14px}.actions{display:grid;grid-template-columns:1fr;width:100%;gap:9px}.actions button{width:100%}.history-item{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:14px}.history-item>div{display:flex;align-items:center;justify-content:space-between;gap:12px}.history-item>div:first-child{display:block}.history-item .pill{width:max-content}.history-item button{width:100%;margin-top:4px}}@media(max-width:380px){.task-card{grid-template-columns:1fr}.task-card>div:first-child{grid-column:auto}.card{padding:14px}}
  </style>
</head>
<body>
<div class="app-shell"><header class="topbar"><div><p class="eyebrow">Daily Trading Review Quiz</p><h1>交易測驗</h1><p class="subtitle">隨機抽取標的與時間，從指定時間開始回看市場，找出你是否真的有交易機會。</p></div><div class="top-actions"><button id="installBtn" class="install-btn" hidden>安裝到桌面</button><button id="newTaskBtn" class="primary">🎲 抽取新任務</button></div></header><main>
<section class="task-card card"><div><span class="label">今日標的</span><div id="symbol" class="big-value">—</div></div><div><span class="label">台灣時間 UTC+8</span><div id="twTime" class="big-value">—</div></div><div><span class="label">TradingView（UTC）</span><div id="gmtTime" class="big-value">—</div></div><div><span class="label">測驗日期</span><div id="taskDate" class="big-value small">—</div></div></section>
<section class="card"><h2>1. 這段行情有沒有符合你的交易機會？</h2><div class="choice-grid"><label><input type="radio" name="tradeDecision" value="多" /> 做多</label><label><input type="radio" name="tradeDecision" value="空" /> 做空</label><label><input type="radio" name="tradeDecision" value="未交易" /> 未交易</label></div></section>
<section class="card"><h2>2. 交易規則檢查</h2><div class="rule-grid"><label><input type="checkbox" id="choch" /> 出現同方向 CHoCH</label><label><input type="checkbox" id="bos" /> 出現同方向 BOS</label><label><input type="checkbox" id="fvg" /> 出現同方向 FVG</label><label><input type="checkbox" id="ob" /> 回到第一個 OB 並符合進場條件</label><label><input type="checkbox" id="fib" /> FIB 0.5 區域符合方向</label><label><input type="checkbox" id="noOppChoch" /> 中間沒有反向 CHoCH</label></div></section>
<section class="card"><h2>3. 模擬交易紀錄</h2><div class="form-grid"><label>進場時間<input id="entryTime" type="datetime-local" /></label><label>進場價格<input id="entryPrice" type="number" step="any" /></label><label>停損<input id="stopLoss" type="number" step="any" /></label><label>停利<input id="takeProfit" type="number" step="any" /></label><label>出場時間<input id="exitTime" type="datetime-local" /></label><label>出場價格<input id="exitPrice" type="number" step="any" /></label><label>盈虧金額<input id="pnl" type="number" step="any" /></label><label>R 倍數<input id="rMultiple" type="number" step="0.01" /></label></div></section>
<section class="card"><h2>4. 原因與覆盤</h2><label class="block-label">進場原因<textarea id="entryReason" rows="4" placeholder="寫下你當時看見的市場結構與進場依據"></textarea></label><label class="block-label">出場原因<textarea id="exitReason" rows="3" placeholder="停損、停利、手動出場，或其他原因"></textarea></label><label class="block-label">事後檢討<textarea id="review" rows="5" placeholder="如果重新做一次，你會改什麼？有沒有違規？"></textarea></label></section>
<section class="card action-card"><div><h2>完成本次測驗</h2><p>紀錄會保存在這台裝置的瀏覽器中，你也可以匯出 JSON 備份。</p></div><div class="actions"><button id="saveBtn" class="primary">儲存測驗</button><button id="exportBtn">匯出全部紀錄</button><button id="clearBtn" class="danger">清空表單</button></div></section>
<section class="card"><div class="history-head"><div><h2>歷史覆盤</h2><p id="statsText">尚無紀錄</p></div></div><div id="historyList" class="history-list"></div></section>
</main></div>
<script>
const SYMBOLS=['BTC','ETH','SOL','AAVE','XRP','ENA','GOLD(XAU)','HYPE'];const STORAGE_KEY='tradingReviewQuizRecordsV1';let currentTask=null;const $=id=>document.getElementById(id);function pad(n){return String(n).padStart(2,'0')}function randomInt(max){return Math.floor(Math.random()*max)}function getTaipeiDateParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const map=Object.fromEntries(parts.map(p=>[p.type,p.value]));return{year:Number(map.year),month:Number(map.month),day:Number(map.day)}}function generateTask(){const{year,month,day}=getTaipeiDateParts();const symbol=SYMBOLS[randomInt(SYMBOLS.length)];const hour=randomInt(24);const minute=randomInt(60);const utc=new Date(Date.UTC(year,month-1,day,hour-8,minute));const twDate=`${year}-${pad(month)}-${pad(day)}`;const gmtDate=`${utc.getUTCFullYear()}-${pad(utc.getUTCMonth()+1)}-${pad(utc.getUTCDate())}`;currentTask={symbol,twTime:`${pad(hour)}:${pad(minute)}`,gmtTime:`${pad(utc.getUTCHours())}:${pad(utc.getUTCMinutes())}`,twDate,gmtDate};renderTask()}function renderTask(){$('symbol').textContent=currentTask.symbol;$('twTime').textContent=currentTask.twTime;$('gmtTime').textContent=`${currentTask.gmtTime}${currentTask.gmtDate!==currentTask.twDate?` (${currentTask.gmtDate})`:''}`;$('taskDate').textContent=currentTask.twDate}function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}}function setRecords(records){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}function selectedDecision(){const el=document.querySelector('input[name="tradeDecision"]:checked');return el?el.value:''}function collectForm(){return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),createdAt:new Date().toISOString(),task:currentTask,decision:selectedDecision(),rules:{choch:$('choch').checked,bos:$('bos').checked,fvg:$('fvg').checked,ob:$('ob').checked,fib:$('fib').checked,noOppChoch:$('noOppChoch').checked},entryTime:$('entryTime').value,entryPrice:$('entryPrice').value,stopLoss:$('stopLoss').value,takeProfit:$('takeProfit').value,exitTime:$('exitTime').value,exitPrice:$('exitPrice').value,pnl:$('pnl').value,rMultiple:$('rMultiple').value,entryReason:$('entryReason').value.trim(),exitReason:$('exitReason').value.trim(),review:$('review').value.trim()}}function clearForm(keepTask=true){document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>el.checked=false);['entryTime','entryPrice','stopLoss','takeProfit','exitTime','exitPrice','pnl','rMultiple','entryReason','exitReason','review'].forEach(id=>$(id).value='');if(!keepTask)generateTask()}function saveRecord(){if(!currentTask)generateTask();const data=collectForm();if(!data.decision){alert('請先選擇：做多、做空或未交易。');return}const records=getRecords();records.unshift(data);setRecords(records);renderHistory();alert('已儲存本次覆盤測驗。')}function deleteRecord(id){setRecords(getRecords().filter(r=>r.id!==id));renderHistory()}function renderHistory(){const records=getRecords(),list=$('historyList');list.innerHTML='';if(!records.length){list.innerHTML='<div class="empty">還沒有覆盤紀錄。</div>';$('statsText').textContent='尚無紀錄';return}const traded=records.filter(r=>r.decision!=='未交易');const wins=traded.filter(r=>Number(r.pnl)>0).length;const avgRVals=traded.map(r=>Number(r.rMultiple)).filter(Number.isFinite);const avgR=avgRVals.length?(avgRVals.reduce((a,b)=>a+b,0)/avgRVals.length).toFixed(2):'—';$('statsText').textContent=`共 ${records.length} 次測驗｜實際模擬進場 ${traded.length} 次｜勝率 ${traded.length?Math.round(wins/traded.length*100):0}%｜平均 R ${avgR}`;records.forEach(r=>{const item=document.createElement('div');const pnl=r.pnl===''?'—':Number(r.pnl).toFixed(2);const pnlClass=Number(r.pnl)>0?'win':Number(r.pnl)<0?'loss':'';item.className='history-item';item.innerHTML=`<div><strong>${r.task.symbol}</strong><div class="muted">${r.task.twDate} ${r.task.twTime} TW</div></div><div><span class="pill">${r.decision}</span></div><div class="${pnlClass}">PnL ${pnl}</div><div>R ${r.rMultiple||'—'}</div><button data-id="${r.id}" class="delete-record">刪除</button>`;list.appendChild(item)});document.querySelectorAll('.delete-record').forEach(btn=>btn.addEventListener('click',()=>deleteRecord(btn.dataset.id)))}function exportData(){const data=JSON.stringify(getRecords(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`trading-review-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}$('newTaskBtn').addEventListener('click',()=>{generateTask();clearForm(true)});$('saveBtn').addEventListener('click',saveRecord);$('exportBtn').addEventListener('click',exportData);$('clearBtn').addEventListener('click',()=>clearForm(true));generateTask();renderHistory();let deferredInstallPrompt=null;const installBtn=$('installBtn');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!deferredInstallPrompt){alert('若目前沒有出現安裝提示，請使用 Chrome 的選單 →「安裝應用程式」或「新增至主畫面」。網站需透過 HTTPS 開啟。');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.hidden=true});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installBtn.hidden=true});if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script></body></html>
